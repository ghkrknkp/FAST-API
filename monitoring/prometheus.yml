global:
  scrape_interval: 5s
  evaluation_interval: 5s
  scrape_timeout: 4s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files to evaluate
rule_files:
  - /etc/prometheus/alert_rules.yml

# Scrape targets
scrape_configs:
  # 1. FastAPI Application Scrape Job
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['fastapi:8000']
        labels:
          app: 'api-monitoring-dashboard'
          env: 'development'

  # 2. Prometheus Self-Monitoring
  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: 'prometheus'
