global:
  resolve_timeout: 1m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'sarincse04@gmail.com'
  smtp_auth_username: 'sarincse04@gmail.com'
  smtp_auth_password: 'zada jzdp txku phsu'
  smtp_require_tls: true

# Alert routing tree
route:
  group_by: ['alertname', 'severity']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      repeat_interval: 15m

# Notification receivers (Email & Slack Webhook)
receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'sarincse04@gmail.com'
        send_resolved: true
    webhook_configs:
      - url: 'http://fastapi:8000/health'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#all-fastapi-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Remediation:* {{ .CommonAnnotations.remediation }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'sarincse04@gmail.com'
        send_resolved: true
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX'
        channel: '#all-fastapi-alerts'
        send_resolved: true
        title: '🚨 [CRITICAL ALERT - {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Remediation:* {{ .CommonAnnotations.remediation }}
